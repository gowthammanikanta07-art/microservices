services:
  catalogdb:
    image: postgres

  basketdb:
    image: postgres

  distributedcache:
    image: redis

  orderdb:
    image: mcr.microsoft.com/mssql/server

  messagebroker:
    image: rabbitmq:management
    
  catalog.api:
    image: gowthamdocker878/catalogservice
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile

  basket.api:
    image: gowthamdocker878/basketservice
    build:
      context: .
      dockerfile: Services/Basket/BasketAPI/Dockerfile

  discount.grpc:
    image: gowthamdocker878/discountservice
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile

  ordering.api:
    image: gowthamdocker878/orderingservice
    build:
      context: .
      dockerfile: Services/Order/Ordering.API/Dockerfile

  yarp:
    image: gowthamdocker878/yarpservice
    build:
      context: .
      dockerfile: ApiGateway/YARP/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:




